<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./vineta-target.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AL ESCANEAR LA VIÑETA DE LA PROFESORA -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Título flotante 3D sobre la viñeta -->
      <a-text 
        value="¡INICIO DEL VIAJE EN EL TIEMPO!" 
        color="#FFD700" 
        align="center" 
        position="0 0.85 0" 
        scale="0.65 0.65 0.65">
      </a-text>

      <!-- Panel informativo con el tema -->
      <a-plane position="0 -0.65 0.1" width="1.6" height="0.35" color="#0f172a" opacity="0.9">
        <a-text 
          value="Modulo 1: Filosofia Educativa a traves de la Historia" 
          color="#38bdf8" 
          align="center" 
          width="2">
        </a-text>
      </a-plane>

      <!-- Elemento 3D: Anillo de Portal del Tiempo giratorio -->
      <a-torus 
        position="0 0.1 0.2" 
        radius="0.35" 
        radius-tubular="0.015" 
        color="#ec4899"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 3000">
      </a-torus>

      <!-- Esfera del Tiempo flotando en el centro -->
      <a-sphere 
        position="0 0.1 0.2" 
        radius="0.1" 
        color="#a855f7"
        animation="property: position; to: 0 0.18 0.2; dir: alternate; loop: true; dur: 1500">
      </a-sphere>

    </a-entity>
  </a-scene>

</body>
</html>
