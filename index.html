<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A-Frame y MindAR para Realidad Aumentada en Web -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Escena de AR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./vineta-target.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Tu modelo 3D o personaje (.gltf / .glb) -->
      <a-asset-item id="personajeModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/bear/scene.gltf"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex: 0 (Corresponde a la primera viñeta) -->
    <a-entity id="vineta-1" mindar-image-target="targetIndex: 0">
      <!-- Objeto 3D que aparece sobre la viñeta -->
      <a-gltf-model 
        src="#personajeModel" 
        position="0 0 0" 
        scale="0.05 0.05 0.05" 
        rotation="90 0 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    // Código JS para detectar cuando el teléfono escanea la viñeta
    const vineta = document.querySelector('#vineta-1');
    
    // Evento: La cámara detecta la viñeta de la historieta
    vineta.addEventListener("targetFound", () => {
      console.log("¡Viñeta detectada!");
    });

    // Evento: El lector mueve la cámara y deja de ver la viñeta
    vineta.addEventListener("targetLost", () => {
      console.log("Viñeta fuera de vista");
    });
  </script>
</body>
</html>
